name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -S style
        with:
          scandir: "."

      - name: bash syntax
        run: |
          bash -n bin/ccswitch
          bash -n install.sh
          bash -n test/smoke.sh
          bash -n test/keychain.sh
          bash -n test/fixtures/security
          bash -n scripts/changelog-extract.sh

      - name: smoke test
        run: bash test/smoke.sh

      - name: keychain backend test
        run: bash test/keychain.sh

      - name: package.json version matches VERSION
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' bin/ccswitch)
          p=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          echo "VERSION=$v  package.json=$p"
          if [ "$v" != "$p" ]; then
            echo "::error::bin/ccswitch declares VERSION=$v but package.json says $p"
            exit 1
          fi

      - name: VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' bin/ccswitch)
          tag="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$v  tag=$tag"
          if [ "v$v" != "$tag" ]; then
            echo "::error::bin/ccswitch declares VERSION=$v but the tag is $tag"
            exit 1
          fi

      - name: CHANGELOG has notes for the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: bash scripts/changelog-extract.sh "${GITHUB_REF#refs/tags/}" > /dev/null

  release:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build release notes from CHANGELOG
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          bash scripts/changelog-extract.sh "$tag" > NOTES.md
          {
            echo
            echo "---"
            echo
            echo "**Install**"
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/install.sh | bash"
            echo '```'
          } >> NOTES.md
          cat NOTES.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes-file NOTES.md \
            --verify-tag

  publish-npm:
    needs: lint
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN is not set - skipping the npm publish"
            exit 0
          fi
          npm publish --access public
