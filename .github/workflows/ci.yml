name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning bin/ccswitch install.sh
      - name: bash syntax
        run: bash -n bin/ccswitch && bash -n install.sh
      - name: smoke test
        run: bash test/smoke.sh
      - name: version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(grep -oP 'VERSION="\K[^"]+' bin/ccswitch)
          [ "v$v" = "${GITHUB_REF#refs/tags/}" ] || { echo "VERSION=$v does not match ${GITHUB_REF#refs/tags/}"; exit 1; }
