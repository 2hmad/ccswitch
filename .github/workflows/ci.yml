name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -S warning bin/ccswitch install.sh
      - name: bash syntax
        run: bash -n bin/ccswitch && bash -n install.sh
      - name: smoke test
        run: bash test/smoke.sh
      - name: VERSION matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION="\(.*\)"$/\1/p' bin/ccswitch)
          tag="${GITHUB_REF#refs/tags/}"
          echo "VERSION=$v  tag=$tag"
          if [ "v$v" != "$tag" ]; then
            echo "::error::bin/ccswitch declares VERSION=$v but the tag is $tag"
            exit 1
          fi
      - name: CHANGELOG has an entry for the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          grep -q "^## \[${tag#v}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## [${tag#v}]' section"
            exit 1
          }
